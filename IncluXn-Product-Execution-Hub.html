let db;try{const stored=JSON.parse(localStorage.getItem(STORAGE_KEY));db=stored?.records&&stored?.settings?{...stored,pilotMetrics:{...defaultPilotMetrics,...stored.pilotMetrics}}:{records:structuredClone(SEED),settings:{...defaultSettings},pilotMetrics:{...defaultPilotMetrics},created:TODAY,updated:TODAY};}catch{db={records:structuredClone(SEED),settings:{...defaultSettings},pilotMetrics:{...defaultPilotMetrics},created:TODAY,updated:TODAY};}

const records=t=>db.records[t]||[];const count=(t,filter)=>records(t).filter(filter||(()=>true)).length;const isDone=r=>['Complete','Approved'].includes(r.status);const phaseName=id=>PHASES.find(x=>x.id===String(id))?.short||'Phase '+id;const score=r=>Math.max(0,Number(r.impact||3)*2+Number(r.confidence||2)-Number(r.effort||3));

const toast=message=>{let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;right:22px;bottom:20px;padding:12px 18px;background:#193e35;color:white;border-radius:10px;z-index:200;font-size:12px;box-shadow:0 15px 30px #0002';document.body.append(el)}el.textContent=message;clearTimeout(toast.t);toast.t=setTimeout(()=>el.remove(),2600)};
function link(url,label){if(!/^https?:\/\//.test(url||''))return '';return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="text-link">${esc(label||'Open source')} ${ico('external',12)}</a>`}
function navHtml(){return `<div class="menu-overlay ${ui.mobile?'visible':''}" data-action="mobile-close"></div><aside class="sidebar ${ui.mobile?'open':''}"><div class="brand"><div class="brand-mark">X</div><div><div class="brand-name">IncluXn</div><div class="brand-caption">Execution Hub</div></div></div><div class="nav-list">${NAV.map(group=>`<div class="nav-heading">${group.label}</div>${group.pages.map(([key,label])=>`<button class="nav-item ${ui.page===key?'active':''}" data-nav="${key}"><span class="nav-ico">${ico(key,16)}</span>${label}${key==='roadmap'?`<span class="tiny-count">${count('roadmap',r=>r.phase==='1')}</span>`:''}</button>`).join('')}`).join('')}</div><div class="sidebar-bottom"><div class="sidebar-note"><strong><span class="pulsedot"></span>Phase 1 · Active priority</strong><p>Institutional Credit Intelligence MVP<br/>Source of truth: local planning workspace</p></div><div class="sidebar-foot">IncluXn · Product operations / v1.0</div></div></aside>`}
function headerHtml(){const page=PAGE_DESC[ui.page];return `<header class="topbar"><button class="icon-btn mobile-toggle" data-action="mobile-toggle" aria-label="Open navigation">${ico('menu')}</button><div class="crumb">PRODUCT / <strong>${esc(page[0])}</strong></div><div class="top-spacer"></div><div class="search-wrap">${ico('search',15)}<input aria-label="Search workspace" type="search" id="global-search" placeholder="Search workspace..." value="${esc(ui.query)}"/><span class="kbd">/</span></div><button class="icon-btn" data-action="export" title="Export JSON" aria-label="Export workspace">${ico('download')}</button><button class="icon-btn" data-action="import" title="Import JSON" aria-label="Import workspace">${ico('upload')}</button><div class="circle-avatar" title="Local workspace">IX</div></header>`}

function metric(label,value,sub,icon='layers'){return `<div class="panel metric"><div class="metric-kicker">${ico(icon,15)} ${label}</div><strong>${value}</strong><small>${sub}</small></div>`}
function filters(t,extra=''){return `<div class="toolbar"><div class="row wrap"><select class="filter-control" data-control="filter" aria-label="Filter status"><option value="all">All statuses</option>${STATES.map(s=>`<option value="${s}" ${ui.filter===s?'selected':''}>${s}</option>`).join('')}</select><select class="filter-control" data-control="phase" aria-label="Filter phase"><option value="all">All phases</option>${PHASES.map(p=>`<option value="${p.id}" ${ui.phase===p.id?'selected':''}>Phase ${p.id} · ${p.short}</option>`).join('')}</select></div>${extra}</div>`}

function recordRow(t,r,opts={}){return `<div class="record" data-edit="${t}:${esc(r.id)}"><div class="record-icon">${ico(t,17)}</div><div class="record-copy"><strong>${esc(r.title)}</strong><p>${esc(r.description)}</p><div class="record-meta">${badge(r.status)} <span class="stamp">Phase ${esc(r.phase)} · ${esc(r.priority)}</span>${r.source==='Project planning'?'':`<span class="stamp">${esc(r.source)}</span>`}</div></div><div class="record-right"><span class="score">Score ${score(r)}</span>${ico('chevron',14)}</div></div>`}
function recordsList(t,limit){const arr=filtered(t).slice(0,limit??9999);return arr.length?`<div class="priority-stack">${arr.map(r=>recordRow(t,r)).join('')}</div>`:empty(t)}

function renderOverview(){const phaseOne=records('roadmap').filter(r=>r.phase==='1'),done=phaseOne.filter(isDone).length;const donePct=phaseOne.length?Math.round(done/phaseOne.length*100):0;const pendingMethod=count('methodology',r=>!isDone(r)),releaseReady=count('release',isDone);const riskList=records('risks').filter(r=>r.priority==='Critical').slice(0,4);const t=records('decisions').find(r=>r.id==='v02');return `${pageHead('overview',false)}<section class="hero"><div class="hero-copy"><span class="hero-kicker"><span class="pulsedot"></span> Institutional-first execution</span><h2>Build intelligence that<br/>institutions can trust.</h2><p>From scattered financial evidence to a controlled, traceable SME credit assessment workflow — without compromising methodology or human judgment.</p><div class="hero-foot"><button class="btn" data-nav="roadmap">View Phase 1 roadmap ${ico('arrow',15)}</button><button class="btn secondary" data-nav="methodology">Methodology controls</button></div></div><div class="hero-detail"><div class="hero-line">Phase 1 roadmap · marked complete</div><div class="hero-big">${donePct}%</div><small>${done} of ${phaseOne.length} Phase 1 items complete · local plan</small><div class="hero-bar"><i style="width:${donePct}%"></i></div></div></section><div class="metric-grid">${metric('Phase 1 features',phaseOne.length,'Planned & proposed records','layers')}${metric('Methodology gates open',pendingMethod,'Await validation or approval','methodology')}${metric('Research questions',count('research'),'Unvalidated until evidence logged','research')}${metric('Release gates passed',releaseReady+' / '+count('release'),'No release implied','check')}</div><div class="two-col"><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Product delivery sequence</h2><p class="panel-sub">Institutional Credit Intelligence comes first. Later phases are editable proposals.</p></div><button class="btn small" data-nav="roadmap">Open roadmap ${ico('chevron',13)}</button></div>${PHASES.map((ph,i)=>{const arr=records('roadmap').filter(r=>r.phase===ph.id),pct=arr.length?100*arr.filter(isDone).length/arr.length:0;return `<div class="phase-item ${i===0?'active':''}"><div class="phase-num">0${ph.id}</div><div class="phase-copy"><strong>${esc(ph.name)}</strong><small>${i===0?'Current delivery focus':'Future proposed scope'} · ${arr.length} items</small></div><div class="phase-progress"><i style="width:${pct}%"></i></div>${i===0?badge('Phase one'):''}</div>`}).join('')}</section><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Critical dependencies</h2><p class="panel-sub">Risks that can block a trustworthy institutional pilot.</p></div><button class="btn small" data-nav="risks">All risks</button></div>${riskList.map(r=>`<div class="risk-item"><span class="risk-dot"></span><div><strong>${esc(r.title)}</strong><small>${esc(r.description)}</small></div>${badge(r.status)}</div>`).join('')}</section></div><div class="two-col section-space"><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Next execution decisions</h2><p class="panel-sub">The highest-impact open items in this planning workspace.</p></div><button class="btn small" data-nav="decisions">Decisions ${ico('chevron',12)}</button></div>${records('decisions').filter(r=>r.status==='Pending').map(r=>`<div class="phase-item"><div class="phase-num">${ico('clock',15)}</div><div class="phase-copy"><strong>${esc(r.title)}</strong><small>${esc(r.description)}</small></div><button class="btn small" data-edit="decisions:${r.id}">Review</button></div>`).join('')}</section><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Project ground truth</h2><p class="panel-sub">Repository observations checked 09 Nov 2026, not a live integration.</p></div>${badge('Verified')}</div>${FACTS.map(f=>`<div class="risk-item"><div style="color:#52836b">${ico('check',16)}</div><div><strong>${esc(f.title)}</strong><small>${esc(f.description)}</small><div style="margin-top:5px">${link(f.url,'Source · '+f.source)}</div></div></div>`).join('')}</section></div><div class="section-space">${note('Important: this is the <b>internal IncluXn execution hub</b>, not the institutional assessment product. The existing GitHub frontend is documented as synthetic/mock and is not connected to this hub. All progress metrics are derived from editable local planning records.')}</div>`}
function renderRoadmap(){const arr=filtered('roadmap');const boardStatuses=['Proposed','Planned','In progress','Blocked','Complete'];let extra=`<div class="segmented">${[['board','Board'],['list','List'],['timeline','Timeline']].map(([v,l])=>`<button data-view="${v}" class="${ui.view===v?'selected':''}">${l}</button>`).join('')}</div>`;let content='';if(ui.view==='board'){content=`<div class="board">${boardStatuses.map(s=>{const rs=arr.filter(r=>s==='Complete'?isDone(r):r.status===s||s==='In progress'&&r.status==='In review');return `<div class="board-col" data-drop-status="${s}"><div class="board-h">${s}<b>${rs.length}</b></div>${rs.map(r=>`<div draggable="true" class="board-card" data-drag-id="${r.id}" data-edit="roadmap:${r.id}"><div class="stage">PHASE ${r.phase} · ${esc(r.priority)}</div><strong>${esc(r.title)}</strong><p>${esc(r.description)}</p><div class="card-bottom"><span class="score">Score ${score(r)}</span><span class="priority ${slug(r.priority)}">${esc(r.owner)}</span></div></div>`).join('')}</div>`}).join('')}</div>`}else if(ui.view==='list'){content=renderTable('roadmap',arr)}else{content=`<section class="panel timeline">${PHASES.map((p,i)=>{const rows=arr.filter(r=>r.phase===p.id);return `<div class="timeline-phase ${i===0?'active':''}"><h3>Phase ${p.id} · ${esc(p.name)}</h3><p>${i===0?'Current delivery focus':'Proposed future phase'} · ${rows.length} planned records · dates not committed</p>${rows.map(r=>`<button class="btn small" style="margin:0 6px 6px 0" data-edit="roadmap:${r.id}">${esc(r.title)} ${badge(r.status)}</button>`).join('')}</div>`}).join('')}</section>`}return `${pageHead('roadmap')}${note('Phase 1 focuses on <b>case → evidence → deterministic methodology → reviewer → traceable report</b>. Drag cards between board columns to update status; the timeline is a sequence, not promised dates.')}${filters('roadmap',extra)}${content}`}
function renderTable(t,arr){return `<section class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>${t==='decisions'?'Decision':'Item'}</th><th>Phase</th><th>Status</th><th>Priority</th><th>Owner</th><th>Score</th><th></th></tr></thead><tbody>${arr.map(r=>`<tr><td><div class="td-title">${esc(r.title)}</div><div class="td-sub">${esc(r.description.slice(0,85))}${r.description.length>85?'...':''}</div></td><td>${esc(phaseName(r.phase))}</td><td>${badge(r.status)}</td><td>${esc(r.priority)}</td><td>${esc(r.owner||'Unassigned')}</td><td><span class="score">${score(r)}</span></td><td><button class="btn small" data-edit="${t}:${r.id}">${ico('edit',12)} Edit</button></td></tr>`).join('')}</tbody></table></div><div class="table-footer"><span>${arr.length} records · saved locally</span><span>Click Edit to update</span></div></section>`}
function renderResearch(){return `${pageHead('research')}${note('Institutional customer demand and willingness to pay are <b>not yet validated</b>. External competitor entries are public-source summaries; verify applicability and procurement details in Lesotho.')}${filters('research')}<div class="two-col"><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Discovery backlog</h2><p class="panel-sub">Research questions, buyer assumptions and evidence collection.</p></div>${badge('Tentative')}</div>${recordsList('research')}</section><section><div class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Priority research themes</h2><p class="panel-sub">What to test before committing commercial positioning.</p></div></div><div class="mini-stack">${[['01','Current workflow','How long does a real SME assessment take, and where does evidence processing break down?'],['02','Economic buyer','Who signs the contract: credit risk, lending operations, innovation or procurement?'],['03','Data and consent','Which documents, permissions and hosting guarantees are essential?'],['04','Commercial feasibility','What measurable benefit would justify a paid pilot or ongoing use?']].map(([n,h,p])=>`<div class="small-card"><div class="stage">RESEARCH / ${n}</div><h3>${h}</h3><p>${p}</p></div>`).join('')}</div></div></section></div><section class="panel section-space"><div class="table-header"><h2 class="panel-title">Competitive landscape</h2><p class="panel-sub">Adjacent categories and current public descriptions. Not a claim of feature parity or market penetration.</p></div><div class="table-wrap"><table class="data-table research-comp"><thead><tr><th>Provider</th><th>Category</th><th>Publicly described scope</th><th>Question for IncluXn</th><th>Source</th></tr></thead><tbody>${COMPETITORS.map(c=>`<tr><td><strong style="color:#2b5045">${esc(c.name)}</strong><div class="td-sub">${esc(c.status)}</div></td><td>${esc(c.category)}</td><td>${esc(c.focus)}</td><td>${esc(c.comparison)}</td><td>${link(c.url,'Verify')}</td></tr>`).join('')}</tbody></table></div></section>`}
function renderExperiments(){const arr=filtered('experiments').sort((a,b)=>score(b)-score(a));return `${pageHead('experiments')}${note('Hypothesis scores are editable prioritisation signals, <b>not validated performance results</b>. Formula: impact × 2 + confidence − effort; each input uses a 1–5 scale.')}${filters('experiments')}<div class="record-cards">${arr.map(r=>`<div class="panel panel-pad" data-edit="experiments:${r.id}" style="cursor:pointer"><div class="panel-head"><div class="eyebrow">EXPERIMENT / ${esc(phaseName(r.phase))}</div><span class="score">Priority ${score(r)}</span></div><h2 class="panel-title" style="font-size:15px;margin-bottom:9px">${esc(r.title)}</h2><p class="body-text" style="min-height:45px">${esc(r.description)}</p><div class="row wrap" style="margin-top:17px">${badge(r.status)}<span class="stamp">Impact ${r.impact}/5</span><span class="stamp">Confidence ${r.confidence}/5</span><span class="stamp">Effort ${r.effort}/5</span></div></div>`).join('')}</div>`}
function renderArchitecture(){const flow=[['Institution','Analyst / reviewer'],['Identity','Tenant + RBAC'],['Cases','Authorised scope'],['Evidence','Private storage'],['Verification','Human-confirmed'],['Methodology','Deterministic'],['Review','Human sign-off'],['Reports','Audited export']];return `${pageHead('architecture')}${note('Architecture is <b>under evaluation</b>. Current GitHub README confirms a browser-based synthetic demo with no live backend adapter. Proposed Convex / Mastra / VPS services are options, not provisioned infrastructure.')}<section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Proposed assessment lifecycle</h2><p class="panel-sub">Protect the scoring boundary and preserve evidence throughout the system.</p></div>${badge('Proposed')}</div><div class="flow-diagram">${flow.map((v,i)=>`<div class="flow-node ${i===5||i===6?'guard':''}"><small>${String(i+1).padStart(2,'0')} / boundary</small><strong>${v[0]}</strong><p>${v[1]}</p></div>`).join('')}</div><div class="notice-line">${ico('methodology',16)} AI and OCR can propose evidence candidates; only verified inputs reach the deterministic methodology engine.</div></section><section class="section-space comparative"><div class="compare-card panel"><div class="eyebrow">OPTION A · RETENTION</div><h3>Harden Express / PostgreSQL</h3><p>Investigate retaining existing backend concepts and improving access control, storage, tests, and auditability.</p><ul><li>Potentially less scoring migration risk</li><li>Existing implementation must be audited</li><li>Backend readiness and test coverage are unknown</li></ul>${badge('Under evaluation')}</div><div class="compare-card panel"><div class="eyebrow">OPTION B · HYBRID MIGRATION</div><h3>Convex + controlled services</h3><p>Investigate reactive app data with separately governed methodology, evidence workers and VPS services.</p><ul><li>Potentially faster reactive product workflows</li><li>Migration parity and permissions are critical</li><li>Pricing, compliance and deployment unverified</li></ul>${badge('Under evaluation')}</div></section><section class="panel panel-pad section-space"><div class="panel-head"><div><h2 class="panel-title">Architecture & migration register</h2><p class="panel-sub">Editable decisions, evaluations and dependencies.</p></div><button class="btn small" data-add="architecture">${ico('plus',13)} Add</button></div>${recordsList('architecture')}</section><div class="links-grid section-space"><a href="https://github.com/Allanfoulo/lesotho-sme-intel" target="_blank" rel="noopener">GitHub project ${ico('external',12)}<span>Current codebase · manual reference</span></a><a href="https://github.com/Allanfoulo/lesotho-sme-intel/blob/main/PRODUCT.md" target="_blank" rel="noopener">Product authority ${ico('external',12)}<span>Existing product boundaries</span></a><a href="https://github.com/Allanfoulo/lesotho-sme-intel/blob/main/README.md" target="_blank" rel="noopener">Repository README ${ico('external',12)}<span>Current demo and test commands</span></a></div>`}
function renderMethodology(){const arr=filtered('methodology');const complete=records('methodology').filter(isDone).length;return `${pageHead('methodology')}${note('Volume I proprietary methodology is an external controlled authority. It is <b>not included in this site</b>. Do not enter confidential formulas or real SME financial data into the local workspace without appropriate safeguards.')}<div class="two-col"><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Methodology assurance register</h2><p class="panel-sub">Mark verified only after an authorised review; no simulated results.</p></div>${badge('Critical')}</div><div class="row" style="justify-content:space-between;margin-bottom:11px"><span class="small-text muted">Gates marked complete</span><strong style="font-size:14px">${complete} / ${count('methodology')}</strong></div><div class="progress-inline" style="margin-bottom:19px"><i style="width:${Math.round(complete/Math.max(1,count('methodology'))*100)}%"></i></div>${arr.map(r=>`<div class="checkrow ${isDone(r)?'done':''}"><input type="checkbox" data-check="methodology:${r.id}" ${isDone(r)?'checked':''}/><span style="flex:1"><strong>${esc(r.title)}</strong><small>${esc(r.description)}</small></span>${badge(r.status)}<button class="btn small" data-edit="methodology:${r.id}" type="button">Edit</button></div>`).join('')}</section><section><div class="panel panel-pad"><div class="panel-head"><h2 class="panel-title">Non-negotiable methodology controls</h2>${ico('methodology',21)}</div>${[['01','Preserve approved logic','Scoring rules must not change silently during migration.'],['02','Version every run','Persist exact methodology version and verified inputs.'],['03','Separate AI from scoring','Generated candidates cannot bypass human verification.'],['04','Require human review','Only authorised reviewer can approve external reports.'],['05','Make results reproducible','Trace output to evidence, calculations and approvals.']].map(([n,h,p])=>`<div class="phase-item"><div class="phase-num">${n}</div><div class="phase-copy"><strong>${h}</strong><small>${p}</small></div></div>`).join('')}</div><div class="panel panel-pad section-space"><h2 class="panel-title">Release dependency</h2><p class="body-text" style="margin:10px 0 14px">The production assessment engine cannot be declared ready until golden test cases, versioning and methodology owner sign-off are recorded.</p><button class="btn soft" data-nav="release">Open release gates ${ico('arrow',14)}</button></div></section></div>`}
function renderDesign(){return `${pageHead('design')}${note('Design task states reflect an editable planning baseline, not approved or implemented frontend coverage. The GitHub demo contains institutional routes but some controls are still simulated.')}${filters('design')}<div class="three-col">${filtered('design').map(r=>`<div class="panel panel-pad" data-edit="design:${r.id}" style="cursor:pointer"><div class="panel-head"><div class="record-icon">${ico('design',18)}</div>${badge(r.status)}</div><h2 class="panel-title" style="font-size:14px;margin-bottom:9px">${esc(r.title)}</h2><p class="body-text" style="min-height:48px">${esc(r.description)}</p><div class="divider"></div><div class="row" style="justify-content:space-between"><span class="stamp">Phase ${r.phase}</span><span class="text-link">Manage screen ${ico('chevron',12)}</span></div></div>`).join('')}</div>`}
function renderCommercial(){const s=db.settings;const nums=([100,400,1000]).map(users=>{const cases=users/100*Number(s.casesPer100||0),base=Number(s.vps||0)+Number(s.db||0)+Number(s.storage||0),withAI=base+cases*(Number(s.ocr||0)+Number(s.ai||0));return {users,cases,base,withAI}});return `${pageHead('commercial')}${note('Every monetary number on this page is an <b>editable planning assumption, not a current supplier quote or verified revenue projection</b>. Costs are simplified illustrative estimates; the model excludes taxes, support, labour, payment fees and enterprise compliance.')}<section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Operating cost assumptions</h2><p class="panel-sub">USD / month · change fields to update 100 / 400 / 1,000 user scenarios. The 100-concurrent-user scenario still requires load testing.</p></div>${badge('Tentative')}</div><div class="form-row">${[['vps','VPS fixed / month (USD)'],['db','Database fixed / month (USD)'],['storage','Storage & backups / month (USD)'],['casesPer100','Cases / 100 users / month'],['ocr','OCR processing / case (USD)'],['ai','AI assistance / case (USD)'],['lslPerUsd','Illustrative LSL per USD'],['perCasePrice','Hypothetical charge / case (USD)']].map(([k,l])=>`<div class="field"><label for="setting-${k}">${l}</label><input id="setting-${k}" data-setting="${k}" type="number" step="0.01" min="0" value="${esc(s[k])}"/></div>`).join('')}</div><div class="row" style="justify-content:end;margin-top:17px"><span class="small-text muted">Saved automatically on change</span></div></section><section class="section-space"><div class="panel-head"><div><h2 class="panel-title">Cost scenarios</h2><p class="panel-sub">No-AI baseline and with OCR/AI case processing. User counts do not imply matched institution or case counts.</p></div></div><div class="calculator">${nums.map(x=>`<div class="calc-tile"><small>${x.users.toLocaleString()} application users · ${Math.round(x.cases)} illustrative cases</small><strong>$${x.withAI.toFixed(2)} <span style="font-size:12px;font-weight:500">/ mo with AI</span></strong><span>$${x.base.toFixed(2)} without AI · ~LSL ${(x.withAI*Number(s.lslPerUsd)).toFixed(0)} with AI</span></div>`).join('')}</div></section><div class="two-even section-space"><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Per-assessment hypothesis</h2><p class="panel-sub">Illustrative gross revenue at ${Number(s.perCasePrice).toFixed(2)} USD / case, not a sales forecast.</p></div></div><div class="calculator">${nums.map(x=>`<div class="calc-tile"><small>${Math.round(x.cases)} cases</small><strong>$${(x.cases*Number(s.perCasePrice)).toFixed(0)}</strong><span>Gross hypothetical monthly revenue</span></div>`).join('')}</div></section><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Commercial prioritisation</h2></div></div><p class="body-text">Validate institutional procurement, buying authority, assessment volume and expected time savings before selecting pricing. Pilot commercial terms remain unconfirmed.</p><button class="btn soft" data-nav="research">Research buyer economics ${ico('arrow',14)}</button></section></div><section class="panel panel-pad section-space"><div class="panel-head"><div><h2 class="panel-title">Commercial models register</h2><p class="panel-sub">Compare offers, risks and validation maturity.</p></div><button class="btn small" data-add="commercial">${ico('plus',13)} Add</button></div>${recordsList('commercial')}</section>`}
function renderPilot(){const m=db.pilotMetrics||defaultPilotMetrics;const v=k=>Number(m[k]||0);return `${pageHead('pilot')}${note('Pilot figures below are <b>manually entered local tracking values</b>, not connected to a CRM or production system. Keep them at zero until supported by actual outreach or signed evidence.')}<div class="metric-grid">${metric('Institutions contacted',v('contacts'),'Manual outreach record','users')}${metric('Discovery interviews',v('interviews'),'Manual research count','research')}${metric('Confirmed pilot partners',v('pilots'),'Requires an approved agreement','check')}${metric('Assessment cases',v('cases'),'Manual pilot report, not live sync','file')}</div><section class="panel panel-pad" style="margin-bottom:17px"><div class="panel-head"><div><h2 class="panel-title">Pilot reporting · manual entry</h2><p class="panel-sub">Update verified programme counts. This is not linked to external customer data.</p></div>${badge('Manual data')}</div><div class="form-row">${[['contacts','Institutions contacted'],['interviews','Interviews completed'],['pilots','Confirmed pilot agreements'],['analysts','Analysts onboarded'],['cases','Cases assessed'],['verified','Evidence sets verified'],['approved','Reviewer-approved reports']].map(([key,label])=>`<div class="field"><label for="pm-${key}">${label}</label><input id="pm-${key}" type="number" min="0" step="1" data-pilot-metric="${key}" value="${v(key)}"/></div>`).join('')}</div></section><div class="two-col"><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Institutional engagement pipeline</h2><p class="panel-sub">Initial customer discovery and pilot readiness tasks.</p></div><button class="btn small" data-add="pilot">${ico('plus',13)} Add</button></div>${recordsList('pilot')}</section><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Pilot entry criteria</h2>${badge('Not validated')}</div><div class="mini-stack">${[['Partner suitability','Institutional sponsor, data owner and security contact defined.'],['Evidence permission','Legal basis, SME disclosure and retention clarified.'],['Methodology validated','Reproducibility and methodology owner approval recorded.'],['Operational readiness','Incident response, backup and role controls tested.'],['Success measurement','Baseline time, quality and adoption metrics agreed.']].map(([h,p])=>`<div class="small-card"><h3>${h}</h3><p>${p}</p></div>`).join('')}</div></section></div>`}
function renderContent(){return `${pageHead('content')}${note('Content is a planning backlog; no campaign performance metrics or publication dates are assumed. Use items as briefs for slides, one-pagers, demos, carousels and financial education.')}${filters('content')}<div class="three-col">${filtered('content').map(r=>`<div class="panel panel-pad" data-edit="content:${r.id}" style="cursor:pointer"><div class="panel-head"><span class="record-icon">${ico('content',18)}</span>${badge(r.status)}</div><div class="eyebrow">PHASE ${r.phase} / COMMUNICATIONS</div><h2 class="panel-title" style="font-size:15px;line-height:1.5;margin-bottom:10px">${esc(r.title)}</h2><p class="body-text" style="min-height:55px">${esc(r.description)}</p><div class="divider"></div><div class="row" style="justify-content:space-between"><span class="stamp">${esc(r.format||'Format to assign')}</span><span class="stamp">${esc(r.priority)} priority</span><span class="text-link">Edit brief ${ico('chevron',12)}</span></div></div>`).join('')}</div>`}
function renderEngineering(){return `${pageHead('engineering')}${note('The inspected repo README says <b>mock is the supported data mode</b>; no Convex, OCR, Mastra or live file backend is provisioned in this frontend. This page is a manual QA tracker, not a live CI dashboard.')}<section class="hero-mini"><div><h3>Current code: lesotho-sme-intel</h3><p>Private GitHub repository · main branch observed · synthetic frontend demo<br/>Do not equate documented routes with production-ready workflows.</p></div><div style="text-align:right">${badge('Demo')}<div style="margin-top:9px">${link('https://github.com/Allanfoulo/lesotho-sme-intel','Open repository')}</div></div></section><div class="two-col"><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Engineering backlog</h2><p class="panel-sub">Click to update owner, priority, status and notes.</p></div><button class="btn small" data-add="engineering">${ico('plus',13)} Add</button></div>${recordsList('engineering')}</section><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">QA evidence checklist</h2><p class="panel-sub">Do not mark passed without a test reference.</p></div></div>${records('release').slice(0,9).map(r=>`<div class="checkrow ${isDone(r)?'done':''}"><input type="checkbox" data-check="release:${r.id}" ${isDone(r)?'checked':''}/><span style="flex:1"><strong>${esc(r.title)}</strong><small>${esc(r.description)}</small></span></div>`).join('')}<div class="divider"></div><button class="btn soft" data-nav="release">Full release tracker ${ico('arrow',14)}</button></section></div><section class="panel panel-pad section-space"><div class="panel-head"><div><h2 class="panel-title">Repository verification notes</h2></div>${badge('Verified')}</div>${FACTS.slice(1).map(f=>`<div class="risk-item"><div style="color:#53866b">${ico('git',17)}</div><div><strong>${esc(f.title)}</strong><small>${esc(f.description)}</small>${link(f.url,'View source')}</div></div>`).join('')}</section>`}
function renderDecisions(){return `${pageHead('decisions')}${note('Official name <b>IncluXn</b> and institutional-first sequencing were confirmed by the product owner. Architecture, commercial model and IP structure remain open. Decisions can be revised and exported.')}${filters('decisions')}<div class="two-col"><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Decision register</h2><p class="panel-sub">Approved instructions vs pending governance choices.</p></div><button class="btn small" data-add="decisions">${ico('plus',13)} New decision</button></div>${recordsList('decisions')}</section><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Decision quality standard</h2></div></div>${[['Owner','Who is accountable for confirming the decision?'],['Evidence','What source, technical result or customer observation supports it?'],['Alternatives','What options were considered and why rejected?'],['Status','Is the decision approved, tentative or awaiting review?'],['Implication','What roadmap, engineering and commercial dependencies change?']].map(([k,v])=>`<div class="phase-item"><div class="phase-num">${ico('check',13)}</div><div class="phase-copy"><strong>${k}</strong><small>${v}</small></div></div>`).join('')}</section></div>`}
function renderRisks(){return `${pageHead('risks')}${filters('risks')}<div class="two-col"><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Risk register</h2></div>${badge('Active monitoring')}</div>${recordsList('risks')}</section><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Governance boundary</h2></div></div><div class="callout">A production credit assessment must not be inferred from a completed UI screen. Institutional trust requires approved methodology outputs, verified evidence, secured access and human review.</div><h3 class="panel-title">Unresolved programme questions</h3><div class="mini-stack">${[['Methodology authority','Who controls and signs off baseline scoring?'],['Institutional buyer','Which team owns budget and pilot approval?'],['Data rights','What basis authorises SME evidence access?'],['Technology decision','Will current backend be improved or migrated?']].map(([h,p])=>`<div class="small-card"><h3>${h}</h3><p>${p}</p></div>`).join('')}</div></section></div>`}
function renderRelease(){const arr=filtered('release'),all=records('release'),done=all.filter(isDone).length;return `${pageHead('release')}${note('Checking a release gate marks a <b>local planning record only</b>; it does not execute tests, verify security or confer regulatory approval. Attach supporting evidence in the record before marking complete.')}<div class="metric-grid">${metric('Gates passed',done+' / '+all.length,'Based on editable local status','check')}${metric('Outstanding',all.length-done,'Critical controls remain','clock')}${metric('Methodology parity','Not verified','Requires approved golden tests','methodology')}${metric('Institutional pilot','Not released','No production deployment verified','pilot')}</div><div class="two-col"><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Pilot acceptance gates</h2><p class="panel-sub">Mark only after documented evidence and appropriate review.</p></div><button class="btn small" data-add="release">${ico('plus',13)} Add gate</button></div>${arr.map(r=>`<div class="checkrow ${isDone(r)?'done':''}"><input type="checkbox" data-check="release:${r.id}" ${isDone(r)?'checked':''}/><span style="flex:1"><strong>${esc(r.title)}</strong><small>${esc(r.description)}</small></span>${badge(r.status)}<button class="btn small" data-edit="release:${r.id}" type="button">Evidence</button></div>`).join('')}</section><section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">Release stage</h2></div>${badge(done===all.length&&all.length>0?'Complete':'Blocked')}</div><p class="body-text">The platform is not ready for an institutional pilot merely because this internal checklist is checked. Requires actual deployed backend, real test evidence, approval, security and institutional sign-offs.</p><div class="progress-inline" style="margin:20px 0 10px"><i style="width:${100*done/Math.max(1,all.length)}%"></i></div><small class="muted">${Math.round(100*done/Math.max(1,all.length))}% recorded gates complete</small><div class="divider"></div><button class="btn soft" data-nav="methodology">Review methodology ${ico('arrow',13)}</button></section></div>`}
function render(){document.getElementById('app').innerHTML=`<div class="app">${navHtml()}<div class="main-shell">${headerHtml()}<main class="workspace" id="main-content">${renderPage()}</main></div></div>`}
function renderPage(){switch(ui.page){case 'overview':return renderOverview();case 'roadmap':return renderRoadmap();case 'research':return renderResearch();case 'experiments':return renderExperiments();case 'architecture':return renderArchitecture();case 'methodology':return renderMethodology();case 'design':return renderDesign();case 'commercial':return renderCommercial();case 'pilot':return renderPilot();case 'content':return renderContent();case 'engineering':return renderEngineering();case 'decisions':return renderDecisions();case 'risks':return renderRisks();case 'release':return renderRelease();default:return renderOverview()}}
function repaintMain(){document.getElementById('main-content').innerHTML=renderPage()}
function go(page){if(!PAGE_DESC[page])return;ui.page=page;ui.filter='all';ui.phase='all';ui.query='';ui.mobile=false;location.hash=page;render();scrollTo(0,0)}
function openEditor(type,id){if(!TYPES[type])return;const existing=records(type).find(r=>r.id===id);const r=existing||item('','', '',type==='roadmap'?'1':'1','Proposed','Medium');const t=existing?'Edit '+TYPES[type]:'New '+TYPES[type];const selected=(v,c)=>String(v)===String(c)?'selected':'';const options=(list,current)=>list.map(s=>`<option value="${esc(s)}" ${selected(s,current)}>${esc(s)}</option>`).join('');document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" id="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(t)}"><div class="modal-top"><div><div class="eyebrow">INCLUXN / ${esc(TYPES[type])}</div><h2>${esc(t)}</h2></div><button class="btn icononly" type="button" data-action="close-modal" aria-label="Close">${ico('close',17)}</button></div><form id="record-form" data-type="${type}" data-id="${esc(id||'')}"><div class="modal-body"><div class="field" style="margin-bottom:14px"><label for="rf-title">Title *</label><input id="rf-title" name="title" required maxlength="180" value="${esc(r.title)}"/></div><div class="field" style="margin-bottom:14px"><label for="rf-desc">Description / hypothesis / decision rationale</label><textarea id="rf-desc" name="description" placeholder="What should happen, why, and what evidence do we need?">${esc(r.description)}</textarea></div><div class="form-row" style="margin-bottom:14px"><div class="field"><label for="rf-status">Status</label><select id="rf-status" name="status">${options(STATES,r.status)}</select></div><div class="field"><label for="rf-phase">Phase</label><select id="rf-phase" name="phase">${PHASES.map(p=>`<option value="${p.id}" ${selected(p.id,r.phase)}>Phase ${p.id} · ${p.short}</option>`).join('')}</select></div><div class="field"><label for="rf-priority">Priority</label><select id="rf-priority" name="priority">${options(PRIORITIES,r.priority)}</select></div><div class="field"><label for="rf-owner">Owner / reviewer</label><input id="rf-owner" name="owner" value="${esc(r.owner)}"/></div><div class="field"><label for="rf-impact">Expected impact (1–5)</label><input id="rf-impact" name="impact" type="number" min="1" max="5" value="${r.impact}"/></div><div class="field"><label for="rf-confidence">Confidence (1–5)</label><input id="rf-confidence" name="confidence" type="number" min="1" max="5" value="${r.confidence}"/></div><div class="field"><label for="rf-effort">Implementation effort (1–5)</label><input id="rf-effort" name="effort" type="number" min="1" max="5" value="${r.effort}"/></div><div class="field"><label for="rf-source">Evidence source / status note</label><input id="rf-source" name="source" value="${esc(r.source||'')}" placeholder="Document, approved review, hypothesis..."/></div></div><div class="field" style="margin-top:14px"><label for="rf-link">Evidence / issue / PR URL</label><input id="rf-link" name="link" type="url" value="${esc(r.link||'')}" placeholder="https://..."/></div><div class="form-row" style="margin-top:14px"><div class="field"><label for="rf-due">Target date (optional)</label><input id="rf-due" name="due" type="date" value="${esc(r.due||'')}"/></div><div class="field"><label for="rf-format">Format / channel / record type</label><input id="rf-format" name="format" value="${esc(r.format||'')}" placeholder="Interview, carousel, one-pager..."/></div></div><div class="field" style="margin-top:14px"><label for="rf-notes">Test results / alternatives / acceptance criteria</label><textarea name="notes" id="rf-notes" placeholder="Supporting notes and validation evidence...">${esc(r.notes||'')}</textarea></div>${existing&&r.link?`<div style="margin-top:9px">${link(r.link,'Open referenced source')}</div>`:''}<p class="copy-note">Saved to this browser only. Do not enter sensitive financial records or secret credentials.</p></div><div class="modal-foot">${existing?`<button type="button" class="btn warn" data-delete="${type}:${esc(r.id)}" style="margin-right:auto">${ico('trash',14)} Delete</button>`:''}<button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">${ico('check',14)} Save record</button></div></form></div></div>`;setTimeout(()=>document.getElementById('rf-title')?.focus(),10)}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function newId(type){return type[0]+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function safeLocalImport(data){if(!data||typeof data!=='object'||!data.records||!data.settings)throw Error('Not an IncluXn workspace JSON export');const updated={records:{},settings:{...defaultSettings},updated:new Date().toISOString(),created:data.created||TODAY};for(const type of Object.keys(TYPES)){if(!Array.isArray(data.records[type]))throw Error('Missing records section: '+type);updated.records[type]=data.records[type].filter(x=>x&&typeof x.title==='string'&&typeof x.id==='string').map(x=>({...item(x.id,x.title,x.description||''),...x})).slice(0,2000)}for(const k of Object.keys(defaultSettings)){const value=Number(data.settings[k]);if(Number.isFinite(value)&&value>=0)updated.settings[k]=value}updated.pilotMetrics={...defaultPilotMetrics};for(const k of Object.keys(defaultPilotMetrics)){const value=Number(data.pilotMetrics?.[k]);if(Number.isInteger(value)&&value>=0)updated.pilotMetrics[k]=value}return updated}
function exportData(){const bytes=JSON.stringify({...db,product:'IncluXn',format:'incluxn-execution-hub-v1',exported:new Date().toISOString()},null,2);const blob=new Blob([bytes],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='IncluXn-Execution-Hub-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Workspace JSON downloaded')}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-nav],[data-add],[data-edit],[data-view],[data-delete]');if(!el){if(e.target.id==='modal-backdrop')closeModal();return}if(el.hasAttribute('data-nav')){go(el.dataset.nav);return}if(el.hasAttribute('data-add')){openEditor(el.dataset.add);return}if(el.hasAttribute('data-edit')){const [t,id]=el.dataset.edit.split(':');openEditor(t,id);return}if(el.hasAttribute('data-view')){ui.view=el.dataset.view;repaintMain();return}if(el.hasAttribute('data-delete')){const [t,id]=el.dataset.delete.split(':');if(confirm('Delete this record? This cannot be undone except by importing an earlier export.')){db.records[t]=records(t).filter(r=>r.id!==id);save();closeModal();render();toast('Record deleted')}return}switch(el.dataset.action){case 'close-modal':closeModal();break;case 'mobile-toggle':ui.mobile=!ui.mobile;render();break;case 'mobile-close':ui.mobile=false;render();break;case 'export':exportData();break;case 'import':document.getElementById('import-file').click();break}});
document.addEventListener('submit',e=>{if(e.target.id!=='record-form')return;e.preventDefault();const form=e.target,t=form.dataset.type,id=form.dataset.id,data=Object.fromEntries(new FormData(form).entries());if(!String(data.title||'').trim())return;const old=records(t).find(r=>r.id===id);const fresh={...(old||item(newId(t),'','')),...data,id:id||newId(t),title:data.title.trim(),phase:String(data.phase||'1'),impact:Math.max(1,Math.min(5,Number(data.impact)||3)),confidence:Math.max(1,Math.min(5,Number(data.confidence)||2)),effort:Math.max(1,Math.min(5,Number(data.effort)||3)),updated:new Date().toISOString()};if(old)Object.assign(old,fresh);else db.records[t].unshift(fresh);save();closeModal();render();toast(old?'Record updated':'Record created')});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.control){ui[el.dataset.control]=el.value;repaintMain();return}if(el.dataset.check){const [t,id]=el.dataset.check.split(':'),r=records(t).find(x=>x.id===id);if(r){if(el.checked&&!String(r.link||'').trim()&&!String(r.notes||'').trim()){el.checked=false;toast('Add evidence or notes before passing this gate');openEditor(t,id);return}r.status=el.checked?'Complete':'Planned';save();repaintMain();toast('Gate updated · evidence verification remains your responsibility')}return}if(el.dataset.setting){const val=Number(el.value);if(Number.isFinite(val)&&val>=0){db.settings[el.dataset.setting]=val;save();repaintMain();toast('Assumption updated')}return}if(el.dataset.pilotMetric){const val=Number(el.value);if(Number.isInteger(val)&&val>=0){db.pilotMetrics[el.dataset.pilotMetric]=val;save();repaintMain();toast('Manual pilot metric saved')}return}});
document.addEventListener('input',e=>{if(e.target.id==='global-search'){ui.query=e.target.value;repaintMain()}});
document.getElementById('import-file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text()),parsed=safeLocalImport(data);if(confirm('Replace your current browser workspace with the imported records? Export first if you need a backup.')){db=parsed;save();render();toast('Workspace imported')}}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return}if((e.key==='/'||e.key.toLowerCase()==='k'&&(e.ctrlKey||e.metaKey))&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();document.getElementById('global-search')?.focus()}});
let dragId=null;document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-drag-id]');if(el){dragId=el.dataset.dragId;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)}});document.addEventListener('dragover',e=>{if(e.target.closest('[data-drop-status]'))e.preventDefault()});document.addEventListener('drop',e=>{const col=e.target.closest('[data-drop-status]');if(col&&dragId){e.preventDefault();const r=records('roadmap').find(x=>x.id===dragId);if(r){r.status=col.dataset.dropStatus;save();repaintMain();toast('Roadmap status updated')}dragId=null}});
window.addEventListener('hashchange',()=>{const p=location.hash.replace('#','');if(PAGE_DESC[p]&&p!==ui.page){ui.page=p;ui.filter='all';ui.phase='all';ui.query='';render()}});
render();
</script></body></html>
